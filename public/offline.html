<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7a1f2b">
  <title>Offline · UniMerch</title>
  <style>
    :root { color-scheme: light; --maroon: #7a1f2b; --gold: #c99a2e; --bg: #fbf8f3; --text: #2b211d; --muted: #6f625a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 360px; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 50%; }
    h1 { margin: 20px 0 8px; font-family: Georgia, serif; font-size: 24px; color: var(--maroon); }
    p { margin: 0 0 24px; line-height: 1.5; color: var(--muted); }
    button { border: 0; border-radius: 999px; padding: 12px 28px; font: 600 15px/1 inherit; color: #fff; background: var(--maroon); cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/sorsu-seal.png" alt="Sorsogon State University seal">
    <h1>You're offline</h1>
    <p>UniMerch needs an internet connection to load your orders, messages and the marketplace. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener("online", () => location.reload())</script>
</body>
</html>
